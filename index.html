<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GPU Atom Stress Benchmark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 20px; left: 20px;
    background: rgba(12, 12, 16, 0.8); backdrop-filter: blur(10px);
    padding: 18px 22px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12);
    z-index: 10; min-width: 260px;
  }
  .fps-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .fps { font-size: 36px; font-weight: 800; color: #00ffaa; line-height: 1; }
  .ms { font-size: 14px; color: #aaa; }
  .gpu { font-size: 12px; color: #888; margin-bottom: 14px; word-break: break-word; max-width: 280px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.15s;
  }
  button:hover { background: rgba(255,255,255,0.2); }
  button.active { background: #ff2a6d; border-color: #ff2a6d; box-shadow: 0 0 15px rgba(255,42,109,0.5); }
  #warn {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    justify-content: center; align-items: center; flex-direction: column; z-index: 20; text-align: center; padding: 20px;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="fps-row">
    <div class="fps"><span id="fps">0</span> FPS</div>
    <div class="ms" id="ms">0.0 ms</div>
  </div>
  <div class="gpu" id="gpu">Определение GPU...</div>
  <div class="btns">
    <button onclick="setSamples(16, this)" class="active">16x</button>
    <button onclick="setSamples(42, this)">42x</button>
    <button onclick="setSamples(96, this)">96x</button>
    <button onclick="setSamples(200, this)">200x 💀</button>
  </div>
</div>

<div id="warn">
  <h1 style="color:#ff2a6d; margin-bottom:10px;">WebGL Context Lost 💀</h1>
  <p style="color:#ccc; max-width:400px;">Видеодрайвер перезагрузился из-за слишком тяжёлого кадра. Обновите страницу и выберите режим полегче.</p>
</div>

<canvas id="gl"></canvas>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 pos;
varying highp vec2 textureUv;
void main() {
    textureUv = pos * 0.5 + 0.5;
    gl_Position = vec4(pos, 0.0, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
varying highp vec2 textureUv;
uniform float vTime;
uniform vec2 vScreenSize;
uniform float vAudio[3];
uniform float vReact[3];
uniform float uSamples;

mat2 rot(float a) {
    float s = sin(a), c = cos(a);
    return mat2(c, -s, s, c);
}

vec3 rainbow(float t) {
    return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
}

vec3 acidBg(vec2 uv, float t, float beatKick, float mid, float high) {
    vec3 col = vec3(0.0);
    float dist = length(uv);
    vec2 p = uv * rot(t * 0.22 + beatKick * 0.45 + 0.5 / (dist + 0.4));

    vec2 warp = p;
    for (float w = 1.0; w <= 9.0; w += 1.0) {
        float freq = w * 2.1;
        float amp = 0.26 / pow(w, 1.18);
        warp += amp * vec2(
            sin(warp.y * freq + t * (1.1 + w * 0.22) + mid * 0.4),
            cos(warp.x * freq - t * (0.9 + w * 0.2) - high * 0.3)
        );
    }

    for (float i = 0.0; i < 16.0; i++) {
        float id = i + 1.0;
        float dir = mod(i, 2.0) == 0.0 ? 1.0 : -1.0;
        vec2 q = warp * rot((i * 0.392699 + t * 0.16) * dir);

        vec2 blobPos = vec2(
            sin(t * (0.52 + i * 0.07) * dir + id * 2.1),
            cos(t * (0.44 + i * 0.09) * dir + id * 1.4)
        ) * (0.34 + mod(i, 4.0) * 0.05);

        float d = length(q - blobPos);
        float pulse = 0.15 + 0.09 * sin(t * 1.7 + id * 2.4) + beatKick * 0.14;
        float blob = smoothstep(pulse + 0.18, pulse * 0.3, d);

        vec3 blobCol = rainbow(i * 0.07 + dist * 0.4 - t * 0.45 + mid * 0.3);
        col += pow(blobCol, vec3(1.25)) * blob * (0.09 + beatKick * 0.15);
    }

    float wave1 = sin(warp.x * 10.0 + t * 1.4) * sin(warp.y * 10.0 - t * 1.2);
    float wave2 = cos((warp.x + warp.y) * 14.0 - t * 2.1) * cos((warp.x - warp.y) * 14.0 + t * 1.8);
    col += rainbow(dist * 0.6 - t * 0.3) * smoothstep(0.65, 1.0, wave1) * (0.04 + high * 0.12);
    col += rainbow(dist * 0.9 + t * 0.4) * smoothstep(0.75, 1.0, wave2) * (0.03 + mid * 0.1);

    return col;
}

vec3 renderScene(vec2 uv, float bass, float mid, float high, float beatKick, float pxSize) {
    vec2 baseUv = uv * (1.0 - beatKick * 0.16);
    float distCenter = length(baseUv);
    float centerAngle = atan(baseUv.y, baseUv.x);

    vec3 bg = acidBg(baseUv, vTime, beatKick, mid, high);

    float coreRadius = 0.055 + beatKick * 0.045;
    float nucleus = smoothstep(coreRadius + pxSize * 1.5, coreRadius * 0.15, distCenter);
    float nucleusGlow = (0.015 + beatKick * 0.035) / (distCenter * distCenter + 0.014);

    float ring1 = smoothstep(pxSize * 2.0, 0.0, abs(distCenter - (coreRadius * 1.65 + high * 0.02)));
    float ring2 = smoothstep(pxSize * 1.6, 0.0, abs(distCenter - (coreRadius * 2.35 + mid * 0.03)));
    float rays = pow(abs(sin(centerAngle * 16.0 - vTime * 3.0)), 6.0) * smoothstep(0.32, 0.05, distCenter);

    vec3 nucleusCol = rainbow(vTime * 0.7 - beatKick * 0.5);
    vec3 atomCore = mix(nucleusCol, vec3(1.0), 0.78) * nucleus * 1.45
                  + nucleusCol * (nucleusGlow * 0.7 + rays * (0.15 + high * 0.35))
                  + mix(nucleusCol, vec3(1.0), 0.65) * (ring1 * (0.35 + high * 0.5) + ring2 * (0.25 + mid * 0.4));

    vec3 electronsAndOrbits = vec3(0.0);

    for (float i = 0.0; i < 24.0; i++) {
        float id = i + 1.0;
        float dir = mod(i, 2.0) == 0.0 ? 1.0 : -1.0;
        float tier = floor(i / 6.0);

        float orbitBeatNudge = beatKick * (0.78 - tier * 0.07) * dir;
        float tilt = i * 0.261799 + vTime * (0.26 - tier * 0.025) * dir + orbitBeatNudge + sin(vTime * 0.4 + id) * 0.16;
        vec2 p = baseUv * rot(tilt);

        float squash = 0.24 + tier * 0.022 + 0.07 * sin(vTime * 0.8 + id * 1.7);
        p.y /= squash;

        float orbitR = 0.28 + tier * 0.175 + beatKick * (0.04 + tier * 0.008);

        float r = length(p);
        float a = atan(p.y, p.x);

        float ripple = sin(a * 8.0 + vTime * 5.0 * dir) * mid * 0.0022;
        float dLine = abs(r - (orbitR + ripple));
        float aaWidth = pxSize * 1.65;
        float baseTrack = (0.00065 / (dLine + aaWidth)) * 0.22;

        float baseSpeed = (2.1 + mod(i, 6.0) * 0.28) * dir;
        float beatDash = beatKick * 0.95 * dir;
        float electronAngle = vTime * baseSpeed + beatDash + id * 1.9;

        float tailLen = 6.2831853 * (0.38 + beatKick * 0.28);

        float angleBehind1 = mod((electronAngle - a) * dir, 6.2831853);
        float trail1 = pow(clamp(1.0 - angleBehind1 / tailLen, 0.0, 1.0), 1.85);

        float angle2 = electronAngle + 2.0943951;
        float angleBehind2 = mod((angle2 - a) * dir, 6.2831853);
        float trail2 = pow(clamp(1.0 - angleBehind2 / (tailLen * 0.7), 0.0, 1.0), 2.0) * 0.65;

        float angle3 = electronAngle + 4.1887902;
        float angleBehind3 = mod((angle3 - a) * dir, 6.2831853);
        float trail3 = pow(clamp(1.0 - angleBehind3 / (tailLen * 0.5), 0.0, 1.0), 2.2) * 0.45;

        float trailLine = (0.0021 + beatKick * 0.001) / (dLine + aaWidth);
        trailLine = pow(trailLine, 1.42) * (trail1 + trail2 + trail3);

        float dotSize = 0.011 + beatKick * 0.009 + pxSize;

        vec2 ePos1 = vec2(cos(electronAngle), sin(electronAngle)) * orbitR;
        float dE1 = length(p - ePos1);
        float dot1 = smoothstep(dotSize + pxSize, 0.0, dE1) * 1.6;
        float halo1 = (0.0038 + beatKick * 0.0035 + high * 0.0018) / (dE1 + aaWidth * 1.5);

        vec2 ePos2 = vec2(cos(angle2), sin(angle2)) * orbitR;
        float dE2 = length(p - ePos2);
        float dot2 = smoothstep(dotSize * 0.75 + pxSize, 0.0, dE2) * 1.15;
        float halo2 = (0.0022 + high * 0.0012) / (dE2 + aaWidth * 1.5);

        vec2 ePos3 = vec2(cos(angle3), sin(angle3)) * orbitR;
        float dE3 = length(p - ePos3);
        float dot3 = smoothstep(dotSize * 0.6 + pxSize, 0.0, dE3) * 0.85;

        vec3 col = rainbow(i * 0.055 + angleBehind1 * 0.09 - vTime * 0.65 - beatKick * 0.35);
        vec3 hotWhite = mix(col, vec3(1.0), 0.86);

        electronsAndOrbits += col * (baseTrack + trailLine)
                            + hotWhite * (dot1 + dot2 + dot3 + (halo1 + halo2) * 0.45);
    }

    vec3 finalColor = bg + atomCore + electronsAndOrbits;
    float edgeFade = 1.0 - smoothstep(0.9, 1.5, length(uv));
    finalColor *= edgeFade;

    return finalColor / (1.0 + finalColor * 0.45);
}

void main() {
    float aspect = vScreenSize.x / max(vScreenSize.y, 1.0);
    vec2 scaleVec = vec2(aspect, 1.0) * 1.85;
    vec2 uv = (textureUv * 2.0 - 1.0) * scaleVec;

    vec2 pixelStep = (2.0 / max(vScreenSize, vec2(1.0))) * scaleVec;
    float pxSize = max(pixelStep.x, pixelStep.y);

    float bass = clamp(vAudio[0] + vReact[0] * 0.8, 0.0, 1.5);
    float mid  = clamp(vAudio[1] + vReact[1] * 0.8, 0.0, 1.5);
    float high = clamp(vAudio[2] + vReact[2] * 0.8, 0.0, 1.5);

    float beatPeak = smoothstep(0.42, 0.95, bass);
    float beatKick = pow(beatPeak, 1.6);

    vec3 col = vec3(0.0);
    for (float s = 0.0; s < 200.0; s += 1.0) {
        if (s >= uSamples) break;
        float r = sqrt((s + 0.5) / uSamples) * 0.5;
        float theta = s * 2.39996323;
        vec2 offset = vec2(cos(theta), sin(theta)) * r * pixelStep;
        col += renderScene(uv + offset, bass, mid, high, beatKick, pxSize);
    }
    col /= uSamples;

    gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, powerPreference: 'high-performance' });
let samples = 16;

canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    document.getElementById('warn').style.display = 'flex';
});

const dbg = gl.getExtension('WEBGL_debug_renderer_info');
document.getElementById('gpu').textContent = dbg
    ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
    : gl.getParameter(gl.RENDERER);

function compile(type, id) {
    const s = gl.createShader(type);
    gl.shaderSource(s, document.getElementById(id).textContent);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'vs'));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, 'fs'));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'vTime');
const uSize = gl.getUniformLocation(prog, 'vScreenSize');
const uAudio = gl.getUniformLocation(prog, 'vAudio');
const uReact = gl.getUniformLocation(prog, 'vReact');
const uSamples = gl.getUniformLocation(prog, 'uSamples');

function setSamples(n, btn) {
    samples = n;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

let frames = 0, lastFpsTime = performance.now(), lastFrameTime = lastFpsTime;

function render(now) {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
        gl.viewport(0, 0, w, h);
    }

    const t = now * 0.001;
    const beat = Math.pow(Math.max(0, Math.sin(t * 4.2)), 4.0);
    const mid = 0.5 + 0.5 * Math.sin(t * 2.7);
    const high = 0.5 + 0.5 * Math.cos(t * 7.3);

    gl.uniform1f(uTime, t);
    gl.uniform2f(uSize, w, h);
    gl.uniform1fv(uAudio, [beat * 0.85, mid * 0.6, high * 0.7]);
    gl.uniform1fv(uReact, [beat * 0.4, mid * 0.3, high * 0.4]);
    gl.uniform1f(uSamples, samples);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    frames++;
    const frameMs = now - lastFrameTime;
    lastFrameTime = now;

    if (now - lastFpsTime >= 500) {
        const fps = Math.round((frames * 1000) / (now - lastFpsTime));
        const fpsEl = document.getElementById('fps');
        fpsEl.textContent = fps;
        fpsEl.style.color = fps >= 55 ? '#00ffaa' : fps >= 25 ? '#ffcc00' : '#ff2a6d';
        document.getElementById('ms').textContent = frameMs.toFixed(1) + ' ms';
        frames = 0;
        lastFpsTime = now;
    }

    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
